name: build-catalog

on:
  push:
    paths:
      - 'tools/build_catalog.py'
      - '.github/workflows/catalog.yml'
      - 'index.html'
      - 'manifest.webmanifest'
      - '_headers'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog from F-Droid index
        run: python3 tools/build_catalog.py --out catalog.json --prev catalog.json

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          if git diff --cached --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "chore: refresh catalog [skip ci]"
            git push
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
              || echo "warning: pages build request failed; site updates on next push"
          fi

      - name: Stage static site
        run: |
          mkdir -p dist
          cp index.html catalog.json manifest.webmanifest _headers dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '5f36acb7a1d2abd0638f6ba0bfc28439'
          command: pages deploy dist --project-name novastore-app --branch main
