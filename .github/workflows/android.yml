name: build-apk

on:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Assemble project
        run: |
          set -euo pipefail
          flutter create --org com.eslam --project-name makhzan --platforms=android --overwrite /tmp/proj
          cp -r app/. /tmp/proj/
          rm -f /tmp/proj/test/widget_test.dart /tmp/proj/analysis_options.yaml
          python3 -m pip install --quiet pillow
          python3 tools/make_icon.py /tmp/proj/android/app/src/main/res
          printf '\ndependencies {\n    implementation "androidx.core:core:1.13.1"\n}\n' >> /tmp/proj/android/app/build.gradle

      - name: Analyze and test
        working-directory: /tmp/proj
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build release APKs
        working-directory: /tmp/proj
        run: flutter build apk --release --split-per-abi

      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "$KS_B64" | base64 -d > /tmp/ks.jks
          mkdir -p "$GITHUB_WORKSPACE/out"
          for abi in arm64-v8a armeabi-v7a; do
            "$BT/zipalign" -f -p 4 "/tmp/proj/build/app/outputs/flutter-apk/app-$abi-release.apk" /tmp/al.apk
            OUT="$GITHUB_WORKSPACE/out/MakhzanStore-${VERSION}-$abi.apk"
            "$BT/apksigner" sign --ks /tmp/ks.jks --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --key-pass env:KS_PASS --out "$OUT" /tmp/al.apk
            "$BT/apksigner" verify --print-certs "$OUT" | head -3
            sha256sum "$OUT"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: makhzan-store-v${{ env.VERSION }}
          name: Makhzan Store ${{ env.VERSION }}
          body: |
            تطبيق مخزن التطبيقات لأندرويد.

            - نفس كتالوج الموقع: تصفح، بحث، تصنيفات.
            - تحميل مع شريط تقدم، والتحقق من SHA-256 قبل التثبيت.
            - بيفتح مثبّت أندرويد بنفسه.

            الحزمة: com.eslam.makhzan — يعمل على أندرويد 5.0 وأحدث.
          files: out/*.apk

      - name: Sync catalog checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="out/MakhzanStore-${VERSION}-arm64-v8a.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(python3 -c "import os,sys;print(round(os.path.getsize(sys.argv[1])/1048576,2))" "$APK")
          python3 - "$SHA" "$SIZE" <<'PYEOF'
          import base64, json, os, re, sys, urllib.request

          sha, size = sys.argv[1], sys.argv[2]
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/%s/contents/catalog.json" % repo

          def call(url, data=None, method="GET"):
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", "Bearer " + tok)
              req.add_header("Accept", "application/vnd.github+json")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              return json.load(urllib.request.urlopen(req, timeout=120))

          raw = urllib.request.urlopen(
              "https://raw.githubusercontent.com/%s/main/catalog.json" % repo, timeout=120
          ).read().decode("utf-8")
          m = re.search(r'"id"\s*:\s*"makhzan-store"', raw)
          if not m:
              print("catalog has no store entry; nothing to sync")
              sys.exit(0)
          i = m.start()
          n = re.search(r'"id"\s*:\s*"', raw[i + 10:])
          j = i + 10 + n.start() if n else len(raw)
          blk = raw[i:j]
          blk = re.sub(r'"sha256"\s*:\s*"[^"]*"', '"sha256":"%s"' % sha, blk, count=1)
          blk = re.sub(r'"size_mb"\s*:\s*[0-9.]+', '"size_mb":%s' % size, blk, count=1)
          out = raw[:i] + blk + raw[j:]
          json.loads(out)
          if out == raw:
              print("catalog already in sync")
              sys.exit(0)
          cur = call(api + "?ref=main")
          body = json.dumps({
              "message": "chore: sync store APK checksum [skip ci]",
              "content": base64.b64encode(out.encode("utf-8")).decode("ascii"),
              "sha": cur["sha"],
              "branch": "main",
          }).encode("utf-8")
          res = call(api, body, "PUT")
          print("catalog updated in", res["commit"]["sha"][:8])
          try:
              call("https://api.github.com/repos/%s/pages/builds" % repo, b"{}", "POST")
              print("pages rebuild requested")
          except Exception as exc:
              print("pages rebuild skipped:", exc)
          PYEOF
