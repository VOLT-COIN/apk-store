name: build-apk

on:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Assemble project
        run: |
          set -euo pipefail
          flutter create --org com.eslam --project-name makhzan --platforms=android --overwrite /tmp/proj
          cp -r app/. /tmp/proj/
          rm -f /tmp/proj/test/widget_test.dart /tmp/proj/analysis_options.yaml
          python3 -m pip install --quiet pillow
          python3 tools/make_icon.py /tmp/proj/android/app/src/main/res
          printf '\ndependencies {\n    implementation "androidx.core:core:1.13.1"\n}\n' >> /tmp/proj/android/app/build.gradle

      - name: Analyze and test
        working-directory: /tmp/proj
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build release APKs
        working-directory: /tmp/proj
        run: flutter build apk --release --split-per-abi

      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "$KS_B64" | base64 -d > /tmp/ks.jks
          mkdir -p "$GITHUB_WORKSPACE/out"
          for abi in arm64-v8a armeabi-v7a; do
            "$BT/zipalign" -f -p 4 "/tmp/proj/build/app/outputs/flutter-apk/app-$abi-release.apk" /tmp/al.apk
            OUT="$GITHUB_WORKSPACE/out/MakhzanStore-${VERSION}-$abi.apk"
            "$BT/apksigner" sign --ks /tmp/ks.jks --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --key-pass env:KS_PASS --out "$OUT" /tmp/al.apk
            "$BT/apksigner" verify --print-certs "$OUT" | head -3
            sha256sum "$OUT"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: makhzan-store-v${{ env.VERSION }}
          name: Makhzan Store ${{ env.VERSION }}
          body: |
            تطبيق مخزن التطبيقات لأندرويد.

            - نفس كتالوج الموقع: تصفح، بحث، تصنيفات.
            - تحميل مع شريط تقدم، والتحقق من SHA-256 قبل التثبيت.
            - بيفتح مثبّت أندرويد بنفسه.

            الحزمة: com.eslam.makhzan — يعمل على أندرويد 5.0 وأحدث.
          files: out/*.apk
