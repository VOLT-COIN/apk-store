<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — تحميل تطبيقات وألعاب أندرويد</title>
<meta name="description" content="NOVA: تحميل تطبيقات وألعاب أندرويد مجانية ومفتوحة المصدر، بروابط مباشرة ورقم تحقق SHA-256 لكل ملف.">
<meta name="theme-color" content="#0b1020">
<meta property="og:title" content="NOVA — متجر تطبيقات وألعاب أندرويد">
<meta property="og:description" content="مئات التطبيقات والألعاب المجانية، بحث وتصنيفات وصفحات تفاصيل كاملة، وتحميل مباشر مع تحقق SHA-256.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://volt-coin.github.io/apk-store/">
<meta property="og:site_name" content="NOVA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233ddc97'/%3E%3Cstop offset='1' stop-color='%232696ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='900' text-anchor='middle' fill='%2306210f' font-family='Tahoma,sans-serif'%3E%D9%85%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0b1020;--bg2:#0f1730;--card:#151f3a;--card2:#1b2748;--fg:#eef2f8;--mut:#9aa7bd;--ac:#3ddc97;--ac2:#2696ff;--on:#06210f;--line:#26324f;--warn:#ffb020}
@media(prefers-color-scheme:light){:root{--bg:#f5f7fb;--bg2:#eef2f9;--card:#fff;--card2:#f2f5fb;--fg:#101828;--mut:#5b667a;--ac:#0a9a62;--ac2:#1668d6;--on:#fff;--line:#e2e7f0}}
html[data-t=light]{--bg:#f5f7fb;--bg2:#eef2f9;--card:#fff;--card2:#f2f5fb;--fg:#101828;--mut:#5b667a;--ac:#0a9a62;--ac2:#1668d6;--on:#fff;--line:#e2e7f0}
html[data-t=dark]{--bg:#0b1020;--bg2:#0f1730;--card:#151f3a;--card2:#1b2748;--fg:#eef2f8;--mut:#9aa7bd;--ac:#3ddc97;--ac2:#2696ff;--on:#06210f;--line:#26324f}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
img{display:block}
.wrap{max-width:1120px;margin:auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:25px;font-weight:900;color:#fff;flex:none}
.brand{font-size:18px;font-weight:900;letter-spacing:-.2px}
.brand small{display:block;font-size:11.5px;font-weight:600;color:var(--mut)}
.srch{flex:1;position:relative;min-width:0}
.srch input{width:100%;padding:12px 42px 12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;font-family:inherit}
.srch input:focus{outline:2px solid color-mix(in srgb,var(--ac) 50%,transparent);border-color:transparent}
.srch svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.5}
.ico-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;font-size:17px;flex:none}
.hero{padding:26px 0 8px}
.hero h1{margin:0 0 8px;font-size:27px;letter-spacing:-.4px}
.hero p{margin:0;color:var(--mut);font-size:14.5px;max-width:640px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mut)}
.stat b{display:block;color:var(--fg);font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06210f;border-color:transparent}
h2.sec{font-size:16px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec span{color:var(--mut);font-weight:600;font-size:12.5px}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.fcard{flex:none;width:150px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:.15s}
.fcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 45%,var(--line))}
.fcard img{width:64px;height:64px;border-radius:16px;margin:0 auto 10px;object-fit:cover;background:var(--card2)}
.fcard b{display:block;font-size:13.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.fcard small{display:block;text-align:center;color:var(--mut);font-size:11.5px;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.c{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;transition:.15s}
.c:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--line));transform:translateY(-2px)}
.c img{width:58px;height:58px;border-radius:15px;object-fit:cover;flex:none;background:var(--card2)}
.c .t{min-width:0;flex:1}
.c .nm{font-size:14.5px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.c .sm{margin:3px 0 0;font-size:12px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c .mt{margin-top:6px;font-size:11px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--card2);border-radius:7px;padding:2px 7px}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.more-btn{display:block;margin:18px auto 0;padding:12px 26px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.how{margin:34px 0 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.how h2{margin:0 0 10px;font-size:16px}
.how ol{margin:0;padding-inline-start:20px;color:var(--mut);font-size:13.5px;line-height:1.9}
footer{margin:34px 0 40px;color:var(--mut);font-size:12px;line-height:1.8}
footer a{color:var(--ac)}
.dwrap{padding:18px 0 40px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;margin-bottom:14px;cursor:pointer;background:none;border:0;font-family:inherit}
.dhero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 16%,var(--card)),var(--card));border:1px solid var(--line);border-radius:22px;padding:20px}
.dhero>div{flex:1;min-width:220px}
.dhero img{width:96px;height:96px;border-radius:22px;object-fit:cover;flex:none;background:var(--card2)}
.dhero h1{margin:0;font-size:23px;letter-spacing:-.3px}
.dhero .dev{color:var(--mut);font-size:13px;margin:4px 0 0}
.dhero .pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:11.5px;color:var(--mut)}
.actions{display:flex;gap:10px;margin:16px 0 0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:15px;font-weight:800;font-size:15px;border:0;cursor:pointer;font-family:inherit}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06210f}
.btn.gh{background:var(--card);border:1px solid var(--line);color:var(--fg)}
.shots{display:flex;gap:10px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shots img{height:330px;border-radius:14px;border:1px solid var(--line);object-fit:cover;cursor:zoom-in;background:var(--card2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.panel h2{margin:0 0 10px;font-size:15.5px}
.panel p{color:var(--mut);font-size:13.5px;white-space:pre-wrap;margin:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:6px}
.kv div{background:var(--card2);border-radius:12px;padding:10px 12px}
.kv span{display:block;color:var(--mut);font-size:11.5px}
.kv b{font-size:13px;word-break:break-all}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all;color:var(--mut);background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.copy{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;flex:none}
.stars{display:flex;gap:6px;font-size:26px;color:var(--mut);cursor:pointer;user-select:none}
.stars i{font-style:normal;transition:.1s}
.stars i.on{color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(4,8,18,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 12px;color:var(--mut);font-size:13px}
.zoom{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:60;padding:10px}
.zoom img{max-width:100%;max-height:100%;border-radius:12px}
.loading{text-align:center;color:var(--mut);padding:60px 0;font-size:14px}
.err{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid var(--warn);border-radius:14px;padding:14px;color:var(--fg);font-size:13.5px;margin:20px 0}
@media(max-width:640px){
 .hero h1{font-size:22px}.dhero{flex-direction:column;text-align:center;align-items:center}.dhero .pills{justify-content:center}
 .grid{grid-template-columns:1fr}.shots img{height:260px}.brand small{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="#" class="logo" aria-label="الرئيسية"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><polygon fill="#fff" points="19.2 12.0 18.9 12.2 18.6 12.5 18.2 12.7 17.8 12.8 17.4 13.0 17.0 13.1 16.6 13.2 16.3 13.2 15.9 13.3 15.6 13.3 15.4 13.4 15.2 13.4 15.0 13.5 14.9 13.5 14.8 13.6 14.8 13.7 14.8 13.9 14.8 14.0 14.9 14.2 15.0 14.5 15.1 14.8 15.2 15.1 15.3 15.4 15.4 15.8 15.5 16.2 15.6 16.6 15.7 17.0 15.7 17.5 15.7 17.9 15.6 18.2 15.3 18.1 14.9 17.9 14.5 17.7 14.2 17.4 13.9 17.1 13.6 16.9 13.3 16.6 13.1 16.3 12.9 16.0 12.7 15.8 12.5 15.6 12.4 15.5 12.2 15.3 12.1 15.3 12.0 15.2 11.9 15.3 11.8 15.3 11.6 15.5 11.5 15.6 11.3 15.8 11.1 16.0 10.9 16.3 10.7 16.6 10.4 16.9 10.1 17.1 9.8 17.4 9.5 17.7 9.1 17.9 8.7 18.1 8.4 18.2 8.3 17.9 8.3 17.5 8.3 17.0 8.4 16.6 8.5 16.2 8.6 15.8 8.7 15.4 8.8 15.1 8.9 14.8 9.0 14.5 9.1 14.2 9.2 14.0 9.2 13.9 9.2 13.7 9.2 13.6 9.1 13.5 9.0 13.5 8.8 13.4 8.6 13.4 8.4 13.3 8.1 13.3 7.7 13.2 7.4 13.2 7.0 13.1 6.6 13.0 6.2 12.8 5.8 12.7 5.4 12.5 5.1 12.2 4.8 12.0 5.1 11.8 5.4 11.5 5.8 11.3 6.2 11.2 6.6 11.0 7.0 10.9 7.4 10.8 7.7 10.8 8.1 10.7 8.4 10.7 8.6 10.6 8.8 10.6 9.0 10.5 9.1 10.5 9.2 10.4 9.2 10.3 9.2 10.1 9.2 10.0 9.1 9.8 9.0 9.5 8.9 9.2 8.8 8.9 8.7 8.6 8.6 8.2 8.5 7.8 8.4 7.4 8.3 7.0 8.3 6.5 8.3 6.1 8.4 5.8 8.7 5.9 9.1 6.1 9.5 6.3 9.8 6.6 10.1 6.9 10.4 7.1 10.7 7.4 10.9 7.7 11.1 8.0 11.3 8.2 11.5 8.4 11.6 8.5 11.8 8.7 11.9 8.7 12.0 8.8 12.1 8.7 12.2 8.7 12.4 8.5 12.5 8.4 12.7 8.2 12.9 8.0 13.1 7.7 13.3 7.4 13.6 7.1 13.9 6.9 14.2 6.6 14.5 6.3 14.9 6.1 15.3 5.9 15.6 5.8 15.7 6.1 15.7 6.5 15.7 7.0 15.6 7.4 15.5 7.8 15.4 8.2 15.3 8.6 15.2 8.9 15.1 9.2 15.0 9.5 14.9 9.8 14.8 10.0 14.8 10.1 14.8 10.3 14.8 10.4 14.9 10.5 15.0 10.5 15.2 10.6 15.4 10.6 15.6 10.7 15.9 10.7 16.3 10.8 16.6 10.8 17.0 10.9 17.4 11.0 17.8 11.2 18.2 11.3 18.6 11.5 18.9 11.8"/></svg></a>
  <div class="brand">NOVA<small>تطبيقات وألعاب أندرويد مجانية</small></div>
  <div class="srch"><input id="q" type="search" placeholder="ابحث عن تطبيق أو لعبة…" autocomplete="off"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
  <button class="ico-btn" id="theme" title="الوضع الليلي/النهاري">◐</button>
</div></header>

<main id="app"><div class="wrap"><div class="loading">جاري تحميل المتجر…</div></div></main>

<script>
(function(){
  "use strict";
  var CATS=[], APPS=[], BYID={}, cat="", q="", shown=24, view="home", cur=null;
  var root=document.getElementById('app'), input=document.getElementById('q');
  var CATALOG_URLS=[
    'catalog.json',
    'https://raw.githubusercontent.com/VOLT-COIN/apk-store/main/catalog.json'
  ];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function okUrl(u){return /^https:\/\//.test(u||'')}
  function sz(m){ if(!m) return ''; return m>=1? (m<10? m.toFixed(2):Math.round(m))+' ميجا' : Math.round(m*1024)+' كيلو' }
  function nm(a){return a.name_ar||a.name||a.id}
  function sum(a){return a.summary||a.desc_ar||(a.desc||'').slice(0,120)||''}
  function desc(a){return a.desc||a.desc_ar||a.summary||''}
  function icon(a){
    if(a.icon_url && /^(https:|data:image)/.test(a.icon_url)) return '<img src="'+esc(a.icon_url)+'" alt="" loading="lazy">';
    return '<img alt="" src="data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#243"/>') +'">';
  }
  function catName(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i].name; return id||'تطبيق' }

  function normalize(d){
    CATS = d.categories || [{id:'apps',name:'تطبيقات'},{id:'games',name:'ألعاب'}];
    APPS = (d.apps||[]).filter(function(a){return a && a.id});
    BYID = {}; APPS.forEach(function(a){ BYID[a.id]=a });
  }

  function route(){
    var h=location.hash||'';
    var m=h.match(/^#\/app\/(.+)$/);
    if(m){ var a=BYID[decodeURIComponent(m[1])]; if(a){ view='detail'; cur=a; return renderDetail(a) } }
    view='home'; cur=null; renderHome();
  }

  function renderHome(){
    var html='';
    html+='<div class="hero"><h1>متجرك العربي لتطبيقات أندرويد</h1>'
      +'<p>تطبيقات وألعاب مجانية ومفتوحة المصدر، بروابط تحميل مباشرة ورقم تحقق SHA-256 لكل ملف. بدون تسجيل وبدون إعلانات مزعجة.</p>'
      +'<div class="stats"><div class="stat"><b>'+APPS.length+'</b>تطبيق ولعبة</div>'
      +'<div class="stat"><b>100%</b>مجاني ومفتوح المصدر</div>'
      +'<div class="stat"><b>SHA-256</b>تحقق من كل ملف</div></div></div>';
    html+='<div class="chips" id="chips"><button class="chip on" data-c="">الكل</button>'
      + CATS.map(function(c){return '<button class="chip" data-c="'+esc(c.id)+'">'+esc(c.name)+'</button>'}).join('')+'</div>';
    html+='<div id="body"></div>';
    html+='<section class="how"><h2>إزاي تثبّت تطبيق؟</h2><ol>'
      +'<li>افتح صفحة التطبيق واضغط <b>تحميل APK</b>.</li>'
      +'<li>لو ظهر تحذير، فعّل <b>السماح من هذا المصدر</b> من إعدادات المتصفح أو الجهاز.</li>'
      +'<li>افتح الملف واضغط <b>تثبيت</b>. تقدر تتأكد من الملف بمقارنة رقم SHA-256.</li></ol></section>';
    html+='<footer>كل التطبيقات هنا حرة ومفتوحة المصدر ومصدرها مستودع <a href="https://f-droid.org" target="_blank" rel="noopener">F-Droid</a>، وروابط التحميل بتفتح على سيرفراتهم الرسمية — إحنا مش بنستضيف ملفات غيرنا. '
      +'الترخيص والمصدر مكتوبين في صفحة كل تطبيق. لو صاحب حق شايف إن ملف مش المفروض يكون هنا، كلّمنا وهنشيله فورًا.</footer>';
    root.innerHTML='<div class="wrap">'+html+'</div>';
    document.getElementById('chips').addEventListener('click',function(e){
      var b=e.target.closest('button.chip'); if(!b) return;
      cat=b.getAttribute('data-c');
      document.querySelectorAll('#chips .chip').forEach(function(x){x.classList.toggle('on',x===b)});
      shown=24; drawBody();
    });
    drawBody();
  }

  function drawBody(){
    var body=document.getElementById('body');
    var t=q.trim().toLowerCase();
    var list=APPS.filter(function(a){
      if(cat && a.category!==cat) return false;
      if(!t) return true;
      return ((a.name||'')+(a.name_ar||'')+(a.summary||'')+(a.desc_ar||'')+(a.developer||'')).toLowerCase().indexOf(t)>=0;
    });
    if(t){
      body.innerHTML='<h2 class="sec">نتائج البحث <span>'+list.length+'</span></h2>'+grid(list.slice(0,shown))
        + (list.length>shown? '<button class="more-btn" id="more">عرض المزيد ('+(list.length-shown)+')</button>':'');
    } else if(cat){
      body.innerHTML='<h2 class="sec">'+esc(catName(cat))+' <span>'+list.length+' تطبيق</span></h2>'+grid(list.slice(0,shown))
        + (list.length>shown? '<button class="more-btn" id="more">عرض المزيد ('+(list.length-shown)+')</button>':'');
    } else {
      var feat=APPS.filter(function(a){return a.featured}).slice(0,14);
      var latest=APPS.slice().sort(function(x,y){return (y.updated||'')<(x.updated||'')?-1:1}).slice(0,12);
      body.innerHTML='<h2 class="sec">مختار بعناية <span>أفضل التطبيقات</span></h2>'
        +'<div class="rail">'+feat.map(function(a){return '<div class="fcard" data-id="'+esc(a.id)+'">'+icon(a)+'<b>'+esc(nm(a))+'</b><small>'+esc(sz(a.size_mb))+'</small></div>'}).join('')+'</div>'
        +'<h2 class="sec">أحدث التحديثات <span>جديد</span></h2>'
        +'<div class="rail">'+latest.map(function(a){return '<div class="fcard" data-id="'+esc(a.id)+'">'+icon(a)+'<b>'+esc(nm(a))+'</b><small>'+esc(a.updated||'')+'</small></div>'}).join('')+'</div>'
        +'<h2 class="sec">كل التطبيقات <span>'+list.length+'</span></h2>'
        +grid(list.slice(0,shown))
        + (list.length>shown? '<button class="more-btn" id="more">عرض المزيد ('+(list.length-shown)+')</button>':'');
    }
    var more=document.getElementById('more');
    if(more) more.onclick=function(){shown+=24; drawBody()};
    body.querySelectorAll('[data-id]').forEach(function(el){
      el.onclick=function(){ location.hash='#/app/'+encodeURIComponent(el.getAttribute('data-id')) };
    });
  }

  function grid(list){
    if(!list.length) return '<div class="empty">مفيش نتائج… جرّب كلمة تانية</div>';
    return '<div class="grid">'+list.map(function(a){
      return '<article class="c" data-id="'+esc(a.id)+'">'+icon(a)
        +'<div class="t"><h3 class="nm">'+esc(nm(a))+'</h3><p class="sm">'+esc(sum(a))+'</p>'
        +'<div class="mt"><span class="tag">'+esc(catName(a.category))+'</span>'
        +(a.size_mb?'<span class="tag">'+esc(sz(a.size_mb))+'</span>':'')
        +(a.version?'<span class="tag">'+esc(String(a.version).slice(0,18))+'</span>':'')
        +'</div></div></article>';
    }).join('')+'</div>';
  }

  function renderDetail(a){
    var shots=(a.screenshots||[]).filter(function(s){return /^https:\/\//.test(s)});
    var can=okUrl(a.apk_url);
    var h='<div class="dwrap"><button class="back" id="back">→ رجوع للمتجر</button>';
    h+='<div class="dhero">'+icon(a)+'<div style="min-width:0">'
      +'<h1>'+esc(nm(a))+'</h1><p class="dev">'+esc(a.developer||'')+'</p>'
      +'<div class="pills"><span class="pill">'+esc(catName(a.category))+'</span>'
      +(a.version?'<span class="pill">إصدار '+esc(a.version)+'</span>':'')
      +(a.size_mb?'<span class="pill">'+esc(sz(a.size_mb))+'</span>':'')
      +(a.license?'<span class="pill">'+esc(a.license)+'</span>':'')
      +'</div></div></div>';
    h+='<div class="actions">'+(can
        ?'<button class="btn pri" id="dl">تحميل APK · '+esc(sz(a.size_mb))+'</button>'
        :'<span class="btn gh">مش متاح للتحميل لسه</span>')
      +(a.source_url?'<a class="btn gh" href="'+esc(a.source_url)+'" target="_blank" rel="noopener">الكود المصدري</a>':'')
      +(a.website?'<a class="btn gh" href="'+esc(a.website)+'" target="_blank" rel="noopener">الموقع</a>':'')
      +'</div>';
    if(shots.length){
      h+='<h2 class="sec">صور من التطبيق</h2><div class="shots">'
        + shots.map(function(s){return '<img src="'+esc(s)+'" alt="" loading="lazy" data-zoom="'+esc(s)+'">'}).join('')+'</div>';
    }
    h+='<div class="panel"><h2>الوصف</h2><p>'+esc(desc(a))+'</p></div>';
    h+='<div class="panel"><h2>معلومات</h2><div class="kv">'
      +'<div><span>اسم الحزمة</span><b>'+esc(a.package_name||a.id)+'</b></div>'
      +(a.version?'<div><span>الإصدار</span><b>'+esc(a.version)+'</b></div>':'')
      +(a.size_mb?'<div><span>الحجم</span><b>'+esc(sz(a.size_mb))+'</b></div>':'')
      +(a.updated?'<div><span>آخر تحديث</span><b>'+esc(a.updated)+'</b></div>':'')
      +(a.min_sdk?'<div><span>أقل إصدار أندرويد</span><b>'+esc(a.min_sdk)+'</b></div>':'')
      +(a.license?'<div><span>الترخيص</span><b>'+esc(a.license)+'</b></div>':'')
      +(a.category?'<div><span>التصنيف</span><b>'+esc(catName(a.category))+'</b></div>':'')
      +'</div>'
      +(a.sha256?'<div class="hash"><span>SHA-256: '+esc(a.sha256)+'</span><button class="copy" data-copy="'+esc(a.sha256)+'">نسخ</button></div>':'')
      +'</div>';
    h+='<div class="panel"><h2>تقييمك</h2><p style="margin-bottom:8px">قيّم التطبيق بنفسك — التقييم بيتحفظ على جهازك.</p><div class="stars" id="stars">'
      +'<i data-v="1">★</i><i data-v="2">★</i><i data-v="3">★</i><i data-v="4">★</i><i data-v="5">★</i></div></div>';
    var sim=APPS.filter(function(x){return x.category===a.category && x.id!==a.id}).slice(0,8);
    if(sim.length){
      h+='<h2 class="sec">تطبيقات مشابهة</h2><div class="rail">'
        + sim.map(function(x){return '<div class="fcard" data-id="'+esc(x.id)+'">'+icon(x)+'<b>'+esc(nm(x))+'</b><small>'+esc(sz(x.size_mb))+'</small></div>'}).join('')+'</div>';
    }
    h+='</div>';
    root.innerHTML='<div class="wrap">'+h+'</div>';
    document.getElementById('back').onclick=function(){ location.hash=''; };
    var dl=document.getElementById('dl');
    if(dl) dl.onclick=function(){ confirmDownload(a) };
    root.querySelectorAll('[data-id]').forEach(function(el){
      el.onclick=function(){ location.hash='#/app/'+encodeURIComponent(el.getAttribute('data-id')); window.scrollTo(0,0) };
    });
    root.querySelectorAll('[data-copy]').forEach(function(b){
      b.onclick=function(){ navigator.clipboard&&navigator.clipboard.writeText(b.getAttribute('data-copy')); b.textContent='تم النسخ'; };
    });
    root.querySelectorAll('[data-zoom]').forEach(function(im){
      im.onclick=function(){ var z=document.createElement('div'); z.className='zoom'; z.innerHTML='<img src="'+esc(im.getAttribute('data-zoom'))+'">'; z.onclick=function(){z.remove()}; document.body.appendChild(z) };
    });
    var stars=document.getElementById('stars'), key='rate:'+a.id, saved=parseInt(localStorage.getItem(key)||'0',10);
    function paint(v){ stars.querySelectorAll('i').forEach(function(s){ s.classList.toggle('on', +s.getAttribute('data-v')<=v) }) }
    paint(saved);
    stars.onclick=function(e){ var v=+e.target.getAttribute('data-v'); if(!v) return; localStorage.setItem(key,String(v)); paint(v); };
    window.scrollTo(0,0);
  }

  function confirmDownload(a){
    var m=document.createElement('div'); m.className='modal';
    m.innerHTML='<div class="sheet"><h3>'+esc(nm(a))+'</h3>'
      +'<p>هيبدأ تحميل ملف APK حجمه '+esc(sz(a.size_mb))+' من السيرفر الرسمي.</p>'
      +(a.sha256?'<div class="hash"><span>SHA-256: '+esc(a.sha256)+'</span><button class="copy" id="cp">نسخ</button></div>':'')
      +'<div class="actions"><a class="btn pri" href="'+esc(a.apk_url)+'" rel="noopener" id="go">ابدأ التحميل</a><button class="btn gh" id="no">إلغاء</button></div>'
      +'<p style="margin-top:12px">بعد التحميل، افتح الملف واضغط تثبيت. لو ظهر تحذير، فعّل «السماح من هذا المصدر».</p></div>';
    document.body.appendChild(m);
    m.onclick=function(e){ if(e.target===m) m.remove() };
    m.querySelector('#no').onclick=function(){ m.remove() };
    var cp=m.querySelector('#cp');
    if(cp) cp.onclick=function(){ navigator.clipboard&&navigator.clipboard.writeText(a.sha256); cp.textContent='تم النسخ' };
    m.querySelector('#go').onclick=function(){ setTimeout(function(){ m.remove() },600) };
  }

  input.addEventListener('input',function(){ q=input.value; shown=24; if(view!=='home'){ location.hash='' } else drawBody() });
  document.getElementById('theme').onclick=function(){
    var cur=document.documentElement.getAttribute('data-t')||'auto';
    var next= cur==='light'?'dark':(cur==='dark'?'auto':'light');
    if(next==='auto') document.documentElement.removeAttribute('data-t'); else document.documentElement.setAttribute('data-t',next);
    localStorage.setItem('t',next);
  };
  (function(){ var t=localStorage.getItem('t'); if(t&&t!=='auto') document.documentElement.setAttribute('data-t',t) })();
  window.addEventListener('hashchange',route);

  function boot(i){
    if(i>=CATALOG_URLS.length){ root.innerHTML='<div class="wrap"><div class="err">تعذّر تحميل كتالوج المتجر. اتأكد من اتصالك بالإنترنت وحاول تحديث الصفحة.</div></div>'; return }
    fetch(CATALOG_URLS[i],{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json() })
      .then(function(d){ if(!d.apps||!d.apps.length) throw 0; normalize(d); route(); })
      .catch(function(){ boot(i+1) });
  }
  boot(0);
})();
</script>
</body>
</html>
